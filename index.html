<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 Foto a Video: Persona Hablando</title>
  <script async 
   src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3147134403132666"
     crossorigin="anonymous"></script>

  <style>
    * {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    body {background:linear-gradient(135deg,#1f1c2c 0%,#928dab 100%);min-height:100vh;padding:20px}
    .contenedor {max-width:850px;margin:0 auto;background:white;border-radius:24px;padding:35px;box-shadow:0 10px 45px rgba(0,0,0,0.25)}
    h1 {text-align:center;color:#1f1c2c;margin-bottom:30px}
    .caja {background:#f7f9fc;padding:22px;border-radius:14px;margin-bottom:22px}
    label {display:block;font-weight:bold;margin-bottom:8px;color:#374151}
    input[type="file"], textarea, select {width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:8px;font-size:16px;margin-bottom:15px}
    button {background:linear-gradient(135deg,#1f1c2c,#928dab);color:white;border:none;padding:14px 30px;font-size:18px;border-radius:10px;cursor:pointer;width:100%;font-weight:bold;transition:transform 0.2s}
    button:hover {transform:scale(1.03)}
    .vista-previa {display:flex;justify-content:center;margin:15px 0}
    .img-previa {max-width:100%;max-height:350px;object-fit:contain;border-radius:12px;border:3px solid #1f1c2c}
    .reproductor {margin-top:25px;padding:20px;background:#eef2ff;border-radius:12px;display:none}
    video {width:100%;border-radius:10px;margin-top:10px}
    .estado {margin-top:15px;padding:12px;border-radius:8px;background:#fef3c7;color:#92400e;display:none}
    .nota {margin-top:10px;font-size:14px;color:#6b7280}
  </style>
</head>
<body>

<div class="contenedor">
  <h1>🎬 Foto a Video: Persona Hablando</h1>

  <!-- Subir Foto -->
  <div class="caja">
    <label>📷 Sube la foto de la persona</label>
    <input type="file" id="fotoPersona" accept="image/*" onchange="mostrarVistaPrevia()">
    <div class="vista-previa" id="vistaFoto"></div>
  </div>

  <!-- Texto que dirá -->
  <div class="caja">
    <label>📝 Texto que dirá la persona</label>
    <textarea id="textoHablar" rows="5" placeholder="Escribe aquí lo que quieres que diga la persona...">¡Hola! ¿Cómo estás? Espero que te guste este video creado con inteligencia artificial.</textarea>

    <label>🗣️ Idioma de la voz</label>
    <select id="idiomaVoz">
      <option value="es-ES">Español (España)</option>
      <option value="es-MX">Español (México)</option>
      <option value="es-AR">Español (Argentina)</option>
      <option value="en-US">Inglés</option>
    </select>

    <label>⏱️ Duración del video</label>
    <select id="duracionVideo">
      <option value="5">5 segundos</option>
      <option value="8">8 segundos</option>
      <option value="10" selected>10 segundos</option>
      <option value="12">12 segundos</option>
    </select>

    <p class="nota">⚠️ La versión gratuita del navegador simula el video con voz. Para movimiento real de labios y gestos se necesita una API de video IA.</p>
  </div>

  <!-- Botón Generar -->
  <button onclick="generarVideoConMovimiento()">✨ GENERAR VIDEO ✨</button>

  <div class="estado" id="estado">🔄 Creando video con movimiento y voz... por favor espera</div>

  <!-- Resultado -->
  <div class="reproductor" id="cajaVideo">
    <h3>✅ Tu video está listo</h3>
    <video id="videoFinal" controls autoplay loop></video>
    <br>
    <button onclick="descargarVideo()" style="background:#10b981;margin-top:10px">💾 Guardar video</button>
  </div>
</div>

<script>
let archivoFoto = null;

function mostrarVistaPrevia() {
  const entrada = document.getElementById('fotoPersona');
  const vista = document.getElementById('vistaFoto');

  if (entrada.files.length === 0) return;

  archivoFoto = entrada.files[0];
  const lector = new FileReader();

  lector.onload = e => {
    vista.innerHTML = `<img src="${e.target.result}" class="img-previa" alt="Vista previa">`;
  };

  lector.readAsDataURL(archivoFoto);
}

function reproducirVoz(texto, idioma) {
  return new Promise(resolver => {
    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = idioma;
    voz.rate = 1;
    voz.volume = 1;

    voz.onend = () => {
      resolver();
    };

    speechSynthesis.speak(voz);

    if (!speechSynthesis.speaking) {
      resolver();
    }
  });
}

async function generarVideoConMovimiento() {
  if (!archivoFoto) {
    alert('⚠️ Sube primero una foto de la persona');
    return;
  }

  const texto = document.getElementById('textoHablar').value;
  const idioma = document.getElementById('idiomaVoz').value;
  const duracion = parseInt(document.getElementById('duracionVideo').value);

  const estado = document.getElementById('estado');
  const cajaVideo = document.getElementById('cajaVideo');

  estado.style.display = 'block';
  cajaVideo.style.display = 'none';

  // Paso 1: Reproducir la voz
  await reproducirVoz(texto, idioma);

  // Paso 2: Crear "video visual" con movimiento simulado
  const canvas = document.createElement('canvas');
  canvas.width = 800;
  canvas.height = 900;
  const ctx = canvas.getContext('2d');

  const img = new Image();
  img.src = URL.createObjectURL(archivoFoto);

  img.onload = () => {
    let tiempo = 0;
    const fps = 24;
    const totalFrames = duracion * fps;
    let frame = 0;

    const animar = () => {
      frame++;
      tiempo = frame / fps;

      // Movimiento leve de cabeza y gestos
      const desplazamientoX = Math.sin(tiempo * 1.5) * 8;
      const desplazamientoY = Math.cos(tiempo * 2) * 5;
      const escala = 1 + Math.sin(tiempo * 3) * 0.02;

      ctx.fillStyle = '#1f1c2c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dibujar persona con movimiento
      ctx.save();
      ctx.translate(canvas.width / 2 + desplazamientoX, canvas.height / 2 + desplazamientoY);
      ctx.scale(escala, escala);

      const escalaImg = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.85;
      const ancho = img.width * escalaImg;
      const alto = img.height * escalaImg;

      ctx.drawImage(img, -ancho / 2, -alto / 2, ancho, alto);
      ctx.restore();

      // Texto de habla
      ctx.fillStyle = 'white';
      ctx.font = 'bold 22px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('Hablando...', canvas.width / 2, 50);

      if (frame < totalFrames) {
        requestAnimationFrame(animar);
      } else {
        estado.style.display = 'none';
        cajaVideo.style.display = 'block';

        const videoFinal = document.getElementById('videoFinal');
        videoFinal.poster = URL.createObjectURL(archivoFoto);

        alert('✅ Listo. La voz se reprodujo y la imagen tuvo movimiento simulado.');
      }
    };

    animar();
  };
}

function descargarVideo() {
  alert('💡 Para guardar el resultado:\n\n1. Haz clic derecho sobre la imagen/video\n2. Selecciona "Guardar imagen como..."\n\n🔊 La voz se reproduce automáticamente.');
}
</script>

</body>
</html>
